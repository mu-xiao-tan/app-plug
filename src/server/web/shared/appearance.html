{{define "appearance"}}<details class="appearance" hidden>
  <summary class="icon-action" title="切换外观" aria-label="切换外观"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></svg></summary>
  <fieldset class="appearance-options">
    <legend>选择外观</legend>
    <label><input type="radio" name="appearance" value="system" checked><span class="swatch system" aria-hidden="true"></span>跟随系统</label>
    <label><input type="radio" name="appearance" value="light"><span class="swatch light" aria-hidden="true"></span>清浅</label>
    <label><input type="radio" name="appearance" value="sand"><span class="swatch sand" aria-hidden="true"></span>暖砂</label>
    <label><input type="radio" name="appearance" value="forest"><span class="swatch forest" aria-hidden="true"></span>深绿</label>
    <label><input type="radio" name="appearance" value="night"><span class="swatch night" aria-hidden="true"></span>午夜蓝</label>
  </fieldset>
</details>{{end}}
