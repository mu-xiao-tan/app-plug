# 将 map 放入两台 Nginx 的 http 上下文（各一次）。
map $http_upgrade $app_plug_connection {
    default upgrade;
    ''      close;
}

# 双层反代的入口示例。部署前替换域名、证书路径和 TEST-NET 上游占位地址。
server {
    listen 443 ssl;
    server_name *.example.com;
    ssl_certificate     /etc/nginx/tls/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/example.com/privkey.pem;

    # API 与应用共用端口；公网入口不接受 IP Host。
    if ($host !~* ^[a-z0-9-]+\.example\.com$) { return 404; }

    location / {
        # 在这里按现有部署要求做入口访问控制，保留原始 Host。
        proxy_pass http://192.0.2.10:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $app_plug_connection;
    }
}

# 内网 Nginx：只放到内网的 http 上下文，保留其他精确域名规则。
server {
    listen 80;
    server_name *.example.com;

    location / {
        # 如修改应用监听地址或 listenPort，请同步调整目标。
        proxy_pass http://127.0.0.1:49101;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $app_plug_connection;
    }
}
